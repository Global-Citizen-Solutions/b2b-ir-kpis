name: Refresh B2B IR KPI Dashboard

# Refreshes the data from HubSpot, builds the dashboard page, bakes it into a
# small nginx image and deploys that to the shared Azure Container Apps
# environment via gcs-azure-infrastructure's reusable workflow (Entra ID
# sign-in in front). Nothing is committed back to the repo: the page holds
# real client/intermediary names, so it only ever lives in this run's
# workspace and in the image. See that repo's docs/onboarding-a-new-app.md
# for the one-time setup (federated credential + role assignment, the Entra
# sign-in App Registration, repo variables/secrets) - none of it lives here.

on:
  # Also redeploys when the code behind the page changes. Scheduled runs only
  # ever run from the repository's default branch, so main must be the
  # default branch (see README, "Deployment").
  push:
    branches: [main]
    paths:
      - dashboard/**
      - generate_report.py
      - requirements.txt
      - Dockerfile
      - nginx.conf
      - .github/workflows/dashboard-data.yml
  schedule:
    # Twice daily at 08:00 and 15:00 Europe/Lisbon local time, year-round
    # across the WET/WEST DST switch. GitHub Actions cron is UTC-only, so
    # this fires at both of Lisbon's possible UTC offsets (07:00 and 08:00
    # UTC cover 08:00 Lisbon; 14:00 and 15:00 UTC cover 15:00 Lisbon). The
    # "Check Lisbon local time" step below accepts whichever of the two
    # daily firings lands in the right half of the day - GitHub routinely
    # delays scheduled runs by hours (all 4 firings here land on :00, a
    # congested queueing time), so an exact-hour match discarded nearly
    # every real firing and the dashboard never auto-refreshed.
    - cron: '0 7,8,14,15 * * *'
  workflow_dispatch: {}

# One refresh/deploy at a time. Two runs close together would both try to
# update the Container App and Azure rejects the second with
# "ContainerAppOperationInProgress". Runs queue instead (the newest waiting
# run replaces older waiting ones, which is fine because it carries fresher
# data), and a deploy that is already running is never cancelled halfway.
concurrency:
  group: deploy-b2b-ir-kpis
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Empty when a scheduled firing was skipped by the Lisbon guard, which
      # also skips the deploy job below.
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check Lisbon local time
        id: lisbon_time
        run: |
          # Cron fires at both UTC offsets Lisbon can be at, so only one of
          # today's two firings for a given target hour is the real one.
          # GitHub Actions delays scheduled runs (observed up to ~5h on this
          # repo), so an exact 08/15 hour match discarded nearly every real
          # firing. Accept any hour in the correct half of the day instead -
          # wide enough to absorb realistic delay, still split at midday so
          # the morning/afternoon UTC-offset firings can't double-count (a
          # manual workflow_dispatch always proceeds regardless).
          hour="$(TZ=Europe/Lisbon date +%H)"
          if [ "$hour" -ge 6 ] && [ "$hour" -lt 12 ]; then
            echo "on_time=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -ge 12 ] && [ "$hour" -lt 22 ]; then
            echo "on_time=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_time=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        run: pip install -r requirements.txt

      - name: Fetch KPI data from HubSpot
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          # Fetches from HubSpot and writes dashboard/data/kpi-data.json.
          # The Excel workbook path (build_workbook()) is dormant - main()
          # no longer calls it, so this only ever produces the JSON.
          python generate_report.py

      - name: Build the dashboard
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        run: |
          # Writes the plaintext outputs/index.html (gitignored, never
          # committed). build_locked.py, the old client-side password lock,
          # is no longer part of the pipeline: Entra sign-in replaces it.
          python3 dashboard/build_dashboard.py

      - name: Log in to GHCR
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        # run_id as well as the sha: scheduled refreshes re-use the same
        # commit with fresh data, and every deploy needs a new image tag.
        run: echo "image=ghcr.io/global-citizen-solutions/b2b-ir-kpis:${{ github.sha }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    needs: refresh-dashboard
    if: needs.refresh-dashboard.outputs.image != ''
    # id-token: write is required here, not just inside the reusable
    # workflow - a reusable-workflow call's token is capped at the
    # intersection of what the caller job grants and what the callee
    # requests, so without this the callee's own `permissions: id-token:
    # write` (for its azure/login OIDC step) is silently reduced to none
    # and the deploy fails at Azure login on every run.
    permissions:
      id-token: write
      contents: read
    uses: Global-Citizen-Solutions/gcs-azure-infrastructure/.github/workflows/deploy-container-app.yml@main
    with:
      app_name: b2b-ir-kpis
      image: ${{ needs.refresh-dashboard.outputs.image }}
      target_port: 8080
      cpu: "0.25"
      memory: "0.5Gi"
      min_replicas: 1
      max_replicas: 2
      # Company sign-in in front of the page (Container Apps Built-in
      # Authentication). The page is plaintext, so this is its only lock: the
      # Entra app must have "assignment required" with a user group before
      # the URL is shared. The App Registration comes from the infra repo's
      # scripts/create-entra-auth-app.sh, which sets ENTRA_CLIENT_ID and
      # ENTRA_CLIENT_SECRET on this repo.
      entra_auth_enabled: true
      entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
    secrets:
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GHCR_PULL_TOKEN }}
      entra_client_secret: ${{ secrets.ENTRA_CLIENT_SECRET }}

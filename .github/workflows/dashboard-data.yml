name: Refresh B2B IR KPI Dashboard

on:
  schedule:
    # Twice daily at 08:00 and 15:00 Europe/Lisbon local time, year-round
    # across the WET/WEST DST switch. GitHub Actions cron is UTC-only, so
    # this fires at both of Lisbon's possible UTC offsets (07:00 and 08:00
    # UTC cover 08:00 Lisbon; 14:00 and 15:00 UTC cover 15:00 Lisbon) and
    # the "Check Lisbon local time" step below discards whichever of the
    # two daily firings doesn't match the real local hour.
    - cron: '0 7,8,14,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check Lisbon local time
        id: lisbon_time
        run: |
          # Cron fires at both UTC offsets Lisbon can be at, so only one of
          # today's two firings for a given target hour is the real one;
          # every step below is skipped unless this matches 08:00/15:00
          # Lisbon (a manual workflow_dispatch always proceeds regardless).
          hour="$(TZ=Europe/Lisbon date +%H)"
          if [ "$hour" = "08" ] || [ "$hour" = "15" ]; then
            echo "on_time=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_time=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        run: pip install -r requirements.txt

      - name: Fetch KPI data from HubSpot
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          # Fetches from HubSpot and writes dashboard/data/kpi-data.json.
          # The Excel workbook path (build_workbook()) is dormant - main()
          # no longer calls it, so this only ever produces the JSON.
          python generate_report.py

      - name: Build the dashboard
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        run: |
          python3 dashboard/build_dashboard.py
          python3 dashboard/build_locked.py --password "${{ secrets.DASHBOARD_PASSWORD }}"

      - name: Commit updated dashboard data + build
        if: github.event_name != 'schedule' || steps.lisbon_time.outputs.on_time == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/kpi-data.json
          # outputs/ is gitignored (a throwaway local build folder that would
          # otherwise carry a locally-typed test password) - force-add just
          # the one file Vercel serves, built here with the real secret.
          git add -f outputs/vercel/index.html
          git diff --staged --quiet || git commit -m "Refresh B2B IR KPI dashboard [skip ci]"
          git push

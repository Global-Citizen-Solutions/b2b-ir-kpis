server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html is the only file and it changes twice a day: never let a
    # browser or proxy keep an old copy, so a refresh shows up on the next
    # load.
    add_header Cache-Control "no-cache" always;
    # Internal tool: keep it out of search results (the page also carries a
    # noindex meta tag).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri /index.html;
    }
}
